<main>
  <h2>Gestión de Incidencias</h2>
  <div class="info">
    <h3>
      Total de incidencias Registradas: {{ tickets().length }}
    </h3>
  </div>
  <section>
    @for (ticket of tickets(); track ticket.id) {
      <app-ticket-card 
        [ticket]="ticket"
        (cambiarEstado)="toggleEstadoTicket(ticket.id)"
        (eliminar)="eliminarTicket(ticket.id)"
      />
    } @empty {
      <div class="vacio">
        <p>¡No hay INCIDENCIAS!</p>
      </div>
    }
  </section>

</main>
