@if(cargando()){
  <p>Cargando...</p>
}

@if(error()){
  <p>{{ error() }}</p>
}

@if(pokemon()){
  <p>{{pokemon()?.name}}({{pokemon()?.id}})</p>
  <div>
    <img [src]="pokemon()?.sprites.front_default" [alt]="pokemon()?.name">
  </div>
}

<input type="text" placeholder="Nombre o número" [(ngModel)]="busqueda" (keyup.enter)="buscarPokemonPorNombreNumero()">
<button (click)="buscarPokemonPorNombreNumero()">Buscar Pokemon por Nombre/Numero</button>
<button (click)="buscarPokemon('pikachu')">Buscar Pokemon</button>
<button (click)="buscarPokemon('inventado')">Probar un 404</button>
