<p *ngIf="userType() == 'admin'">Soy un administrador</p>
<p *ngIf="userType() == 'usuario'">Soy un usuario</p>
<p *ngIf="userType() == ''">Soy un invitado</p>

<!--
@if (userType() == 'admin'){
  <p>Soy un administrador</p>
} @else if (userType() == 'usuario') {
  <p>Soy un usuario</p>
} @else {
  <p>Soy un invitado</p>
}
-->

@switch (userType()) {
  @case ('admin') {
    <p>Soy un administrador</p>
  }
  @case ('usuario') {
    <p>Soy un usuario</p>
  }
  @default {
    <p>Soy un invitado</p>
  }
}
<div>
  <button (click)="cambiarRol('admin')">Ser Admin</button>
  <button (click)="cambiarRol('usuario')">Ser Usuario</button>
  <button (click)="cambiarRol('')">Ser invitado</button>
</div>

<ul>
  @for (fruta of frutas(); track $index) {
    <li class="{{$even ? 'elementoImpar': ''}}">{{fruta}}</li>
  }
</ul>

<!--
$index -> indice de 0 a n
$count -> el numero de elementos del array
$first -> true si el elemeto es el primero
$last -> true si el elemento es el ultimo
$even -> true si el elemento es impar
$odd -> true si el elemento es par
-->
